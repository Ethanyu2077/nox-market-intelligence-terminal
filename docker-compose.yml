x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    logging: *log-rotation
    environment:
      POSTGRES_USER: nox
      POSTGRES_PASSWORD: nox_local_only
      POSTGRES_DB: nox_market_intelligence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nox_timescale:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nox -d nox_market_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    logging: *log-rotation
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nox_redis:/data
volumes:
  nox_timescale:
  nox_redis:
